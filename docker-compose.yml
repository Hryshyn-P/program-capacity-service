services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: capacity
      POSTGRES_DB: capacity
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capacity -d capacity"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka-native:4.1.2
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    command: ["node", "dist/scripts/run-migrations.js"]
    environment: &app-env
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://capacity:capacity@postgres:5432/capacity
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: program-capacity
      KAFKA_GROUP_ID: program-capacity-worker
      KAFKA_TOPIC: treasury.program-capacity
      KAFKA_DLQ_TOPIC: treasury.program-capacity.dlq
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-at-least-32-chars}
      JWT_ISSUER: program-capacity-service
      JWT_AUDIENCE: program-capacity-api
      LOG_LEVEL: log
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    build: .
    command: ["node", "dist/scripts/seed.js"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build: .
    command: ["node", "dist/src/main.js"]
    environment: *app-env
    ports: ["3000:3000"]
    depends_on:
      seed: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

volumes:
  postgres-data:
